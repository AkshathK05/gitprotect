[[rule]]
id = "SEC-001"
severity = "block"
kind = "line"
patterns = [
  '''gh[pousr]_[A-Za-z0-9]{36,}''',
  '''github_pat_[A-Za-z0-9_]{22,}''',
]
title = "Exposed GitHub Personal Access Token"
what_happened = "A GitHub personal access token was detected in staged changes."
fix_steps = [
