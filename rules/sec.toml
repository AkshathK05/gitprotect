[[rule]]
id = "SEC-001"
severity = "block"
kind = "line"
patterns = [
  '''AKIA[0-9A-Z]{16}''',
]
title = "Exposed AWS Access Key"
what_happened = "An AWS access key ID was detected in staged changes."
fix_steps = [
  "Remove the access key from the code and use environment variables instead.",
  "If already committed or pushed, rotate the key in the AWS console immediately.",
]
rotate_url = "https://console.aws.amazon.com/iam/home#/security_credentials"

[[rule]]
id = "SEC-001"
severity = "block"
kind = "line"
patterns = [
  '''sk-proj-[A-Za-z0-9_-]{20,}''',
]
title = "Exposed OpenAI API Key"
what_happened = "An OpenAI secret API key was detected in staged changes."
fix_steps = [
  "Remove the secret key from the code and load it from environment variables.",
  "Revoke and rotate the exposed API key in OpenAI dashboard.",
]
rotate_url = "https://platform.openai.com/api-keys"

