  "Revoke the token in GitHub Settings and create a new one.",
]
rotate_url = "https://github.com/settings/tokens"

[[rule]]
id = "SEC-001"
severity = "block"
kind = "line"
patterns = [
  '''sbp_[0-9a-f]{40}''',
]
title = "Exposed Supabase Access Token"
what_happened = "A Supabase personal access token was detected in staged changes."
fix_steps = [
  "Remove the token from source code.",
  "Revoke and regenerate the token in Supabase account settings.",
]
rotate_url = "https://supabase.com/dashboard/account/tokens"

[[rule]]
id = "SEC-002"
severity = "block"
kind = "line"
patterns = [
  '''(NEXT_PUBLIC|VITE|REACT_APP|EXPO_PUBLIC)_[A-Z0-9_]*(SECRET|SERVICE_ROLE|PRIVATE|PASSWORD|ADMIN)[A-Z0-9_]*''',
]
title = "Public Frontend Variable Contains Secret Keyword"
what_happened = "A public frontend environment variable name contains a sensitive keyword, risking secret leakage to client bundles."
fix_steps = [
  "Do not expose server-side secrets or service roles via client-accessible environment variables.",
  "Move the secret to a server-only environment variable without public client prefixes.",
]

[[rule]]
id = "SEC-003"
severity = "block"
kind = "line"
patterns = [
  '''(postgres(ql)?|mongodb(\+srv)?|mysql|redis)://[^\s:/@'"]+:[^\s@'"${}]+@''',
]
title = "Hardcoded Database Connection String with Credentials"
what_happened = "A database URI containing plaintext password credentials was detected."
fix_steps = [
  "Use environment variables (e.g. DATABASE_URL) to supply connection strings at runtime.",
  "Rotate the database user password if this file was ever committed or shared.",
]

[[rule]]
id = "SEC-004"
severity = "block"
kind = "line"
patterns = [
  '''-----BEGIN [A-Z ]*PRIVATE KEY-----''',
]
title = "Embedded Private Key"
what_happened = "An unencrypted private key header was found in staged code."
fix_steps = [
  "Store private keys in external secure credential storage or files specified in .gitignore.",
  "Rotate the compromised key pair immediately.",
]

[[rule]]
id = "SEC-005"
severity = "warn"
kind = "line"
patterns = []
title = "High Entropy String Near Sensitive Keyword"
what_happened = "A high-entropy quoted literal was found on a line containing credential-related keywords."
fix_steps = [
  "Check whether this quoted string is an API secret, password, or token.",
  "If it is a secret, move it to an environment variable or secure config.",
]
