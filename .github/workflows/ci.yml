name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: npm/gitprotect-darwin-arm64
            bin: gitprotect
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg: npm/gitprotect-linux-x64
            bin: gitprotect
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: npm/gitprotect-win32-x64
            bin: gitprotect.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (via rust-toolchain.toml)
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Code formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cross-target Clippy (Linux/Windows)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - name: Cargo tests
        run: cargo test

      - name: Build target binary for smoke test
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary into platform package
        shell: bash
        run: |
          mkdir -p ${{ matrix.pkg }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.pkg }}/bin/${{ matrix.bin }}
          chmod +x ${{ matrix.pkg }}/bin/${{ matrix.bin }} || true

      - name: Run npm smoke test
        shell: bash
        run: ./scripts/test-npm-smoke.sh

  docker-smoke:
    name: Docker Smoke Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
            pkg: npm/gitprotect-linux-x64
            bin: gitprotect
            use_cross: false
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
            pkg: npm/gitprotect-linux-arm64
            bin: gitprotect
            use_cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Rust toolchain (via rust-toolchain.toml)
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: "!matrix.use_cross"
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} --bin gitprotect

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bin gitprotect

      - name: Stage binary
        run: |
          mkdir -p ${{ matrix.pkg }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.pkg }}/bin/${{ matrix.bin }}
          chmod +x ${{ matrix.pkg }}/bin/${{ matrix.bin }}

      - name: Run smoke test inside node:22 container
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/workspace -w /workspace node:22 bash -c "apt-get update && apt-get install -y git && ./scripts/test-npm-smoke.sh"
